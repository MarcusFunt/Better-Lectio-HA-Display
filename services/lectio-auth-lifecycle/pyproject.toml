[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "better-lectio-auth-lifecycle"
version = "0.1.0"
description = "Restricted on-demand lifecycle control for the Lectio auth browser"
requires-python = ">=3.12"
dependencies = [
    "docker>=7,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
