[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "better-lectio-gateway"
version = "0.1.0"
description = "Lectio session and data gateway for Better Lectio HA Display"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "python-lectio==1.31.0",
    "requests>=2.31,<3",
    "tzdata>=2024.2,<2027",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
lint = ["ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
