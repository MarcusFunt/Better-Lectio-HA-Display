[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "better-lectio-auth-browser"
version = "0.1.0"
description = "On-demand Playwright browser for manual Lectio/MitID login"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "playwright==1.63.0",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
