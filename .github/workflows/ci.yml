name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and service dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e "services/lectio-gateway[test,lint]" -e "services/lectio-auth-browser" -e "services/lectio-auth-lifecycle[test]" -e "services/display-service[test,lint]"
      - name: Run tests
        run: make test
      - name: Run lint
        run: make lint
      - name: Validate Compose configuration
        run: make compose-config
      - name: Build service images
        run: make compose-build
