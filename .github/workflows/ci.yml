name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build Lectio XIAO ESP32-S3 firmware
        run: pio run -d firmware -e lectio_s3

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests and lint in the service Python environment
        run: |
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
            --workdir /workspace \
            python:3.12-slim \
            sh -ec '
              apt-get update
              apt-get install --no-install-recommends --yes fonts-dejavu-core make
              python -m pip install -r requirements-dev.txt
              python -m pip install -e "services/lectio-gateway[test,lint]" -e "services/lectio-auth-browser" -e "services/lectio-auth-lifecycle[test]" -e "services/display-service[test,lint]"
              make test
              make lint
            '
      - name: Validate Compose configuration
        run: make compose-config
      - name: Build service images
        run: make compose-build
