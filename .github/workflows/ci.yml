name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  home-assistant-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant and test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "homeassistant==2026.9.3" "ruff>=0.12,<0.13"
      - name: Test Home Assistant integration
        run: make test-home-assistant
      - name: Lint Home Assistant integration
        run: python -m ruff check --select E4,E7,E9,F,I home-assistant

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and service dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e "services/lectio-gateway[test,lint]" -e "services/lectio-auth-browser" -e "services/lectio-auth-lifecycle[test]" -e "services/display-service[test,lint]"
      - name: Install the renderer font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-dejavu-core
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Run tests
        run: make test
      - name: Run lint
        run: make lint
      - name: Validate Compose configuration
        run: make compose-config
      - name: Build service images
        run: make compose-build
